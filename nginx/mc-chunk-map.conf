# ─────────────────────────────────────────────────────────────
#  nginx/mc-chunk-map.conf
#  Configuración para Nginx Proxy Manager (NPM) — bloque custom
#
#  En NPM: Advanced → Custom Nginx Configuration
#  Host: map.tudominio.com → Forward a localhost:8200
# ─────────────────────────────────────────────────────────────

# Cabeceras de proxy estándar
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Cache de la API de chunks (120s — igual que CACHE_TTL del backend)
location /api/ {
    proxy_pass         http://127.0.0.1:8200;
    proxy_cache_valid  200 120s;
    add_header         X-Cache-Status $upstream_cache_status;
}

# Assets estáticos sin cache
location /static/ {
    proxy_pass http://127.0.0.1:8200;
    expires    off;
}

# Fallback al frontend
location / {
    proxy_pass http://127.0.0.1:8200;
}
