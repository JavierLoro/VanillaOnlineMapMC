<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Chunk Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a1a; --surface: #242424; --border: rgba(255,255,255,0.1);
    --text: #e8e8e8; --muted: #8a8a8a; --accent: #4a9e6e; --accent2: #2d7a52;
    --radius: 8px; --font: 'Segoe UI', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  #app { display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 280px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #map-container { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; background: #111; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 15px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .sidebar-header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
  input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 6px 10px; outline: none; }
  input[type="text"]:focus { border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); transition: background 0.15s; width: 100%; margin-top: 6px; }
  .btn:hover { background: rgba(255,255,255,0.07); }
  .btn.primary { background: var(--accent2); border-color: var(--accent); color: #fff; }
  .btn.warning { background: #3a2a10; border-color: #8a5a10; color: #e0a040; }
  .btn.warning:hover { background: #4a3510; }
  .btn.primary:hover { background: var(--accent); }
  .layer-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
  .layer-row input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
  .layer-row label { font-size: 13px; cursor: pointer; flex: 1; }
  .layer-row .layer-hint { font-size: 11px; color: var(--muted); }
  #legend-list { flex: 1; overflow-y: auto; padding: 8px 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-radius: 4px; transition: opacity 0.15s; }
  .legend-item:hover { opacity: 0.8; }
  .legend-item.hidden { opacity: 0.3; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
  .legend-name { font-size: 12px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hl-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1; flex-shrink: 0; }
  .hl-btn:hover { color: var(--accent); }
  .hl-btn.active { color: var(--accent); }
  #map-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 1000; }
  .map-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 6px 12px; font-size: 12px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.15s; }
  .map-btn:hover { background: rgba(255,255,255,0.12); }
  #loading { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; gap: 12px; }
  #loading p { font-size: 14px; color: var(--muted); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tile-tooltip { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; font-size: 12px; color: var(--text); min-width: 180px; pointer-events: none; }
  .tile-tooltip strong { color: var(--accent); }
  #floating-tooltip { position: fixed; z-index: 9999; display: none; }
  #status { padding: 6px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leaflet-image-layer { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>&#9947; Minecraft Chunk Map</h1>
      <p id="world-path">Cargando mundo...</p>
    </div>

    <div class="section">
      <div class="section-title">Filtrar bioma</div>
      <input type="text" id="biome-search" placeholder="Buscar bioma..." oninput="filterLegend(this.value)">
      <button class="btn" onclick="toggleAllBiomes(true)">Mostrar todos</button>
      <button class="btn" onclick="toggleAllBiomes(false)">Ocultar todos</button>
      <button class="btn primary" onclick="refreshData()">&#8635; Actualizar mapa</button>
      <button class="btn warning" id="btn-reset-world" onclick="checkNewWorld()">&#9762; Nuevo mundo</button>
    </div>

    <div class="section">
      <div class="section-title">Capas de relieve</div>
      <div class="layer-row">
        <input type="checkbox" id="layer-topo" onchange="onLayerChange()">
        <label for="layer-topo">Topograf&iacute;a</label>
        <span class="layer-hint">altura</span>
      </div>
      <div class="layer-row">
        <input type="checkbox" id="layer-hillshade" onchange="onLayerChange()">
        <label for="layer-hillshade">Hillshading</label>
        <span class="layer-hint">pendiente</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Estructuras</div>
      <div class="layer-row">
        <input type="checkbox" id="layer-blocks" onchange="onLayerChange()" checked>
        <label for="layer-blocks">Bloques</label>
        <span class="layer-hint">zona activa</span>
      </div>
    </div>

    <div class="section-title" style="padding:10px 16px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)">Leyenda de biomas</div>
    <div id="legend-list"></div>
    <div id="status">Iniciando...</div>
  </div>

  <div id="map-container">
    <div id="map"></div>
    <div id="floating-tooltip"><div class="tile-tooltip" id="tooltip-inner"></div></div>
    <div id="map-controls">
      <button class="map-btn" onclick="resetView()">&#8962; Centrar</button>
      <button class="map-btn" onclick="goToSpawn()">&#9733; Spawn</button>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <p id="loading-msg">Cargando mapa...</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "";

let allTiles      = [];
let tileMap       = new Map();
let boundsInfo    = null;
let spawnMarker   = null;
let biomeVisibility = {};
let lastStats     = null;
let imageOverlay  = null;
let highlightedBiome = null;

// PNG-based rendering state
let pngLayers     = null;      // {base, shade, hillshade, isolines, blocks} — Image elements
let tiRaw         = [];        // [[bx4, bz4, pi, ws], ...]
let tiPalette     = [];        // [{name, color}, ...]
let pngBounds     = null;      // {bx4_min, bx4_max, bz4_min, bz4_max}
let biomePixels   = new Map(); // palette_idx → Int32Array of interleaved pixel (x, y) pairs
let biomeColorMap = new Map(); // biome name → hex color

const layers = { topo: false, hillshade: false, isolines: false, blocks: true };

const map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: -6,
  maxZoom: 8,
  zoomControl: false,
});

const floatingTooltip = document.getElementById("floating-tooltip");
const tooltipInner    = document.getElementById("tooltip-inner");

function mc2ll(bx4, bz4) { return L.latLng(-bz4, bx4); }

// ── Image loading ─────────────────────────────────────────────────────────────

function loadImage(url) {
  return new Promise(function(res, rej) {
    const img = new Image();
    img.onload  = function() { res(img); };
    img.onerror = function() { rej(new Error("Error cargando " + url)); };
    img.src = url;
  });
}

// ── Biome pixel index ─────────────────────────────────────────────────────────

function buildBiomePixels() {
  const tmp     = new Map();
  const bx4_min = pngBounds.bx4_min;
  const bz4_min = pngBounds.bz4_min;
  for (const entry of tiRaw) {
    const pi = entry[2];
    if (!tmp.has(pi)) tmp.set(pi, []);
    tmp.get(pi).push(entry[0] - bx4_min, entry[1] - bz4_min);
  }
  biomePixels = new Map();
  for (const kv of tmp) {
    biomePixels.set(kv[0], new Int32Array(kv[1]));
  }
}

// ── Canvas rendering ──────────────────────────────────────────────────────────

function buildTileMap() {
  tileMap.clear();
  for (const t of allTiles) tileMap.set(t.bx4 + "," + t.bz4, t);
}

function overlayBounds() {
  const b = boundsInfo;
  return [[ -(b.maxBz4+1), b.minBx4 ], [ -b.minBz4, b.maxBx4+1 ]];
}

function applyBiomeOverlay(ctx, w, h) {
  if (!tiRaw.length) return;
  const hasHidden = tiPalette.some(function(p) { return biomeVisibility[p.name] === false; });
  const hasHighlight = highlightedBiome !== null;
  if (!hasHidden && !hasHighlight) return;

  const ov   = document.createElement("canvas");
  ov.width = w; ov.height = h;
  const oc   = ov.getContext("2d");
  const imgd = oc.createImageData(w, h);
  const d    = imgd.data;

  if (hasHighlight) {
    // Dim all pixels
    for (let i = 3; i < d.length; i += 4) d[i] = 175;
    // Punch out highlighted biome (make transparent in overlay)
    var hlIdx = -1;
    for (var pi = 0; pi < tiPalette.length; pi++) {
      if (tiPalette[pi].name === highlightedBiome) { hlIdx = pi; break; }
    }
    if (hlIdx >= 0 && biomePixels.has(hlIdx)) {
      const coords = biomePixels.get(hlIdx);
      for (let i = 0; i < coords.length; i += 2) {
        d[(coords[i+1] * w + coords[i]) * 4 + 3] = 0;
      }
    }
  }

  // Cover hidden biomes with background color
  for (const kv of biomePixels) {
    const pi = kv[0], coords = kv[1];
    if (biomeVisibility[tiPalette[pi].name] === false) {
      for (let i = 0; i < coords.length; i += 2) {
        const px = (coords[i+1] * w + coords[i]) * 4;
        d[px] = 0x1a; d[px+1] = 0x1a; d[px+2] = 0x1a; d[px+3] = 255;
      }
    }
  }

  oc.putImageData(imgd, 0, 0);
  ctx.drawImage(ov, 0, 0);
}

function drawMainCanvas() {
  if (!boundsInfo || !pngLayers) return;
  const w = boundsInfo.w, h = boundsInfo.h;

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");

  ctx.drawImage(pngLayers.base, 0, 0);

  if (layers.topo) {
    ctx.globalCompositeOperation = "multiply";
    ctx.drawImage(pngLayers.shade, 0, 0);
    ctx.globalCompositeOperation = "source-over";
  }
  if (layers.hillshade) {
    ctx.globalCompositeOperation = "multiply";
    ctx.drawImage(pngLayers.hillshade, 0, 0);
    ctx.globalCompositeOperation = "source-over";
  }

  if (layers.isolines) {
    ctx.drawImage(pngLayers.isolines, 0, 0);
  }
  if (layers.blocks) {
    ctx.drawImage(pngLayers.blocks, 0, 0);
  }
  applyBiomeOverlay(ctx, w, h);

  const url    = canvas.toDataURL("image/png");
  const bounds = overlayBounds();
  if (imageOverlay) {
    imageOverlay.setUrl(url);
  } else {
    imageOverlay = L.imageOverlay(url, bounds, { opacity: 1, interactive: false }).addTo(map);
  }
}

function renderTiles() {
  buildTileMap();
  if (imageOverlay) { imageOverlay.remove(); imageOverlay = null; }
  drawMainCanvas();
}

function rerenderTiles() { drawMainCanvas(); }

// ── Tooltip via mousemove ────────────────────────────────────────────────────

map.on("mousemove", function(e) {
  const bx4 = Math.floor(e.latlng.lng);
  const bz4 = Math.floor(-e.latlng.lat);
  const t   = tileMap.get(bx4 + "," + bz4);
  if (t) {
    tooltipInner.innerHTML = buildTooltip(t);
    const x = e.originalEvent.clientX, y = e.originalEvent.clientY;
    floatingTooltip.style.left    = (x + 16) + "px";
    floatingTooltip.style.top     = y + "px";
    floatingTooltip.style.display = "block";
  } else {
    floatingTooltip.style.display = "none";
  }
});
map.on("mouseout", function() { floatingTooltip.style.display = "none"; });

// ── Layer / biome controls ───────────────────────────────────────────────────

function onLayerChange() {
  layers.topo      = document.getElementById("layer-topo").checked;
  layers.hillshade = document.getElementById("layer-hillshade").checked;
  layers.blocks    = document.getElementById("layer-blocks").checked;
  rerenderTiles();
}

function toggleBiome(biome, item) {
  biomeVisibility[biome] = !biomeVisibility[biome];
  item.classList.toggle("hidden", !biomeVisibility[biome]);
  rerenderTiles();
}

function setHighlight(biome) {
  highlightedBiome = highlightedBiome === biome ? null : biome;
  document.querySelectorAll(".hl-btn").forEach(function(btn) {
    btn.classList.toggle("active", btn.dataset.biome === highlightedBiome);
  });
  rerenderTiles();
}

function toggleAllBiomes(visible) {
  highlightedBiome = null;
  document.querySelectorAll(".hl-btn").forEach(function(btn) { btn.classList.remove("active"); });
  Object.keys(biomeVisibility).forEach(function(b) { biomeVisibility[b] = visible; });
  document.querySelectorAll(".legend-item").forEach(function(i) { i.classList.toggle("hidden", !visible); });
  rerenderTiles();
}

// ── Tooltip content ──────────────────────────────────────────────────────────

function buildTooltip(t) {
  const name = t.biome.replace("minecraft:", "").replace(/_/g, " ");
  const bx   = t.bx4 * 4, bz = t.bz4 * 4;
  const cx   = Math.floor(t.bx4 / 4), cz = Math.floor(t.bz4 / 4);
  const yStr = t.ws != null ? "<br>Altura: " + Math.round(t.ws) + " Y" : "";
  const blockStr = t.block
    ? "<br>Bloque: " + t.block.replace("minecraft:","").replace(/_/g," ")
    : "";
  return "<strong>" + name + "</strong>" +
         "<br>Bloque: (" + bx + ", " + bz + ")<br>Chunk: (" + cx + ", " + cz + ")" + yStr + blockStr;
}

// ── Legend ───────────────────────────────────────────────────────────────────

function buildLegend(distribution) {
  const list = document.getElementById("legend-list");
  list.innerHTML = "";
  Object.keys(distribution).forEach(function(b) {
    if (biomeVisibility[b] === undefined) biomeVisibility[b] = true;
  });
  Object.entries(distribution).forEach(function(entry) {
    const biome = entry[0];
    const color = biomeColorMap.get(biome) || "#888";
    const name  = biome.replace("minecraft:", "").replace(/_/g, " ");
    const item  = document.createElement("div");
    item.className = "legend-item" + (biomeVisibility[biome] !== false ? "" : " hidden");
    item.dataset.biome = biome;
    item.innerHTML =
      '<div class="legend-swatch" style="background:' + color + '"></div>' +
      '<span class="legend-name" title="' + biome + '">' + name + "</span>" +
      '<button class="hl-btn" data-biome="' + biome + '" title="Resaltar en mapa">&#9678;</button>';
    item.onclick = function() { toggleBiome(biome, item); };
    item.querySelector(".hl-btn").onclick = function(e) {
      e.stopPropagation();
      setHighlight(biome);
    };
    list.appendChild(item);
  });
}

function filterLegend(query) {
  const q = query.toLowerCase();
  document.querySelectorAll(".legend-item").forEach(function(item) {
    const n = item.dataset.biome.replace("minecraft:", "").replace(/_/g, " ");
    item.style.display = n.includes(q) ? "" : "none";
  });
}

// ── Spawn ────────────────────────────────────────────────────────────────────

function renderSpawn(spawn) {
  if (spawnMarker) { map.removeLayer(spawnMarker); spawnMarker = null; }
  spawnMarker = L.circleMarker(mc2ll(spawn.bx4, spawn.bz4), {
    radius: 7, color: "#fff", weight: 2,
    fillColor: "#e74c3c", fillOpacity: 1, zIndexOffset: 1000,
  }).addTo(map);
  spawnMarker.bindTooltip(
    '<div class="tile-tooltip"><strong>&#9733; Spawn</strong><br>Bloque: (' + spawn.x + ", " + spawn.z + ")<br>Y: " + spawn.y + "</div>",
    { className: "tile-tooltip", sticky: true, offset: [12, 0] }
  );
}

function goToSpawn() {
  if (spawnMarker) { map.setView(spawnMarker.getLatLng(), 4); spawnMarker.openTooltip(); }
}

// ── View ─────────────────────────────────────────────────────────────────────

function resetView() {
  if (!boundsInfo) return;
  const b = boundsInfo;
  map.fitBounds([mc2ll(b.minBx4, b.minBz4+1), mc2ll(b.maxBx4+1, b.minBz4)], { padding: [20, 20] });
}

// ── Data loading ─────────────────────────────────────────────────────────────

async function loadChunks() {
  document.getElementById("loading").style.display = "flex";
  setStatus("Consultando API...");
  try {
    // Phase 1: PNGs + stats (fast — muestra el mapa enseguida)
    document.getElementById("loading-msg").textContent = "Descargando mapa...";
    const [basePng, shadePng, hillshadePng, isolinesPng, blocksPng, statsRes, spawnRes] = await Promise.all([
      loadImage(API + "/api/map.png?layer=base"),
      loadImage(API + "/api/map.png?layer=shade"),
      loadImage(API + "/api/map.png?layer=hillshade"),
      loadImage(API + "/api/map.png?layer=isolines"),
      loadImage(API + "/api/map.png?layer=blocks"),
      fetch(API + "/api/stats"),
      fetch(API + "/api/spawn"),
    ]);

    pngLayers = { base: basePng, shade: shadePng, hillshade: hillshadePng, isolines: isolinesPng, blocks: blocksPng };
    lastStats = await statsRes.json();
    pngBounds = lastStats.map_bounds;

    boundsInfo = {
      minBx4: pngBounds.bx4_min, maxBx4: pngBounds.bx4_max,
      minBz4: pngBounds.bz4_min, maxBz4: pngBounds.bz4_max,
      w: pngBounds.bx4_max - pngBounds.bx4_min + 1,
      h: pngBounds.bz4_max - pngBounds.bz4_min + 1,
    };

    // Mostrar mapa inmediatamente
    document.getElementById("loading").style.display = "none";
    drawMainCanvas();
    resetView();
    if (spawnRes.ok) renderSpawn(await spawnRes.json());
    document.getElementById("world-path").textContent = lastStats.world_path || "—";
    setStatus("Cargando interactividad...");

    // Phase 2: tile-index (necesario para tooltips y toggle de biomas)
    const tiRes = await fetch(API + "/api/tile-index");
    if (!tiRes.ok) throw new Error("tile-index HTTP " + tiRes.status);

    const ti = await tiRes.json();
    tiRaw     = ti.tiles;
    tiPalette = ti.palette;
    biomeColorMap = new Map(tiPalette.map(function(p) { return [p.name, p.color]; }));

    // Construir allTiles para tileMap (tooltips)
    allTiles = tiRaw.map(function(entry) {
      var blk = (ti.block_palette && entry[4] !== undefined)
                ? ti.block_palette[entry[4]] : null;
      return {
        bx4:   entry[0],
        bz4:   entry[1],
        biome: tiPalette[entry[2]].name,
        color: tiPalette[entry[2]].color,
        ws:    entry[3],
        block: (blk && blk !== "null") ? blk : null,
      };
    });

    buildBiomePixels();
    buildTileMap();
    buildLegend(lastStats.biome_distribution);

    const chunks = (lastStats.total_full_chunks || 0).toLocaleString();
    const hRange = lastStats.height_range
      ? " | Y " + lastStats.height_range.min + "–" + lastStats.height_range.max
      : "";
    setStatus(allTiles.length.toLocaleString() + " tiles — " + chunks + " chunks" + hRange);
  } catch (e) {
    setStatus("Error: " + e.message);
    console.error(e);
    document.getElementById("loading").style.display = "none";
  }
}

function refreshData() {
  fetch(API + "/api/refresh", { method: "POST" })
    .then(function() { loadChunks(); })
    .catch(function(e) { setStatus("Error al refrescar: " + e.message); });
}

function setStatus(msg) { document.getElementById("status").textContent = msg; }

async function checkNewWorld() {
  const btn = document.getElementById("btn-reset-world");
  btn.disabled = true;
  btn.textContent = "Comprobando...";
  try {
    const res  = await fetch(API + "/api/reset-world", { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.reset) {
      setStatus("Nuevo mundo detectado (seed " + data.new_seed + "). Recargando...");
      await loadChunks();
    } else {
      setStatus("Mismo mundo — sin cambios (seed " + data.seed + ")");
      setTimeout(function() {
        if (lastStats) {
          const chunks = (lastStats.total_full_chunks || 0).toLocaleString();
          setStatus(allTiles.length.toLocaleString() + " tiles — " + chunks + " chunks");
        }
      }, 3000);
    }
  } catch (e) {
    setStatus("Error al comprobar mundo: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "☢ Nuevo mundo";
  }
}

loadChunks();
</script>
</body>
</html>
